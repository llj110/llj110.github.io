<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#f8f7f4">
  <title>{{ page.title }} · {{ site.title }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ site.title }} · {{ page.title }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ site.data.profile.portrait_url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/icon/ll.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
  <script src="{{ '/assets/js/common.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include navbar.html %}
  <div class="page-shell">
    <main id="main-content" class="main-content" tabindex="-1">{{ content }}</main>
  </div>
  {% include footer.html %}
</body>
</html>
